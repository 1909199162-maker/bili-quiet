<!DOCTYPE html>
<!-- popup.html —— 点插件图标弹出来的小窗口（宽 280px） -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --line: #e8e8ed;
      --track-off: #d2d2d7;
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 18px 18px 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 7px;
      vertical-align: 2px;
    }
    h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .01em; }
    .sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }

    /* 一行：文字 + 开关 */
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .label { font-size: 13px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* 开关本体：一个 checkbox，用 CSS 画成 iOS 那种样子 */
    .switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
    .switch input {
      position: absolute; opacity: 0; width: 100%; height: 100%;
      margin: 0; cursor: pointer; z-index: 2;
    }
    .track {
      position: absolute; inset: 0;
      background: var(--track-off);
      border-radius: 26px;
      transition: background 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .track::after {
      content: "";
      position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(18px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

    .foot {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 11px; color: #a1a1a6;
      display: flex; justify-content: space-between;
    }
    .state { color: var(--ink); }
  </style>
</head>
<body>
  <h1><span class="dot"></span>静一静</h1>
  <p class="sub">只管 B站 首页那一大片推荐流。</p>

  <div class="row">
    <div>
      <div class="label">隐藏推荐流</div>
      <div class="hint" id="hint">关掉它，推荐流立刻回来</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="track"></span>
    </label>
  </div>

  <div class="foot">
    <span>状态：<strong class="state" id="state">读取中…</strong></span>
    <span>v1.1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
